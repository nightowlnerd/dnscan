name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build binaries
        run: |
          # Linux amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dnscan-linux-amd64 .

          # Linux arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dnscan-linux-arm64 .

          # macOS amd64
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dnscan-darwin-amd64 .

          # macOS arm64 (Apple Silicon)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dnscan-darwin-arm64 .

          # Windows amd64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dnscan-windows-amd64.exe .

      - name: Create tarballs with data
        run: |
          for arch in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            mkdir -p dist/$arch
            cp dnscan-$arch dist/$arch/dnscan
            chmod +x dist/$arch/dnscan
            cp -r data dist/$arch/
            tar -czvf dnscan-$arch.tar.gz -C dist/$arch .
          done

          # Windows zip with data
          mkdir -p dist/windows-amd64
          cp dnscan-windows-amd64.exe dist/windows-amd64/dnscan.exe
          cp -r data dist/windows-amd64/
          zip -r dnscan-windows-amd64.zip dist/windows-amd64

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dnscan-linux-amd64
            dnscan-linux-arm64
            dnscan-darwin-amd64
            dnscan-darwin-arm64
            dnscan-windows-amd64.exe
            dnscan-linux-amd64.tar.gz
            dnscan-linux-arm64.tar.gz
            dnscan-darwin-amd64.tar.gz
            dnscan-darwin-arm64.tar.gz
            dnscan-windows-amd64.zip
          generate_release_notes: true
